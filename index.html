
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para Meibellyn ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
.screen{display:none;position:relative;width:100%;height:100%;align-items:center;justify-content:center;background:#000}
.screen.active{display:flex}
.screen img{display:block;width:100%;height:100%;object-fit:contain}
#intro{cursor:pointer}
#start{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;z-index:5;cursor:pointer}
#start .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#proposal{position:relative}
#proposal img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#choices{position:absolute;inset:0;z-index:10}
.choice{position:absolute;border:0;background:transparent;color:transparent;padding:0;margin:0;cursor:pointer}
#yes{left:8%;top:57%;width:46%;height:29%}
#no{left:55%;top:59%;width:36%;height:25%}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.heart{position:absolute;top:-60px;font-size:28px;animation:fall 4s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg);opacity:0}}
.final-fade{animation:fadein 1s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
audio{display:none}
</style>
</head>
<body>

<div id="intro" class="screen active">
<img src="img/intro.png" alt="Girasol romántico para comenzar la sorpresa">
<button id="start" aria-label="Toca el girasol para comenzar">
<span class="sr">Toca el girasol para comenzar</span>
</button>
</div>

<div id="sequence" class="screen">
<img id="slide" src="" alt="Sorpresa romántica">
</div>

<div id="proposal" class="screen" aria-label="Propuesta">
<img src="img/propuesta.png" alt="¿Quieres ser mi novia?">
<div id="choices">
<button id="yes" class="choice" aria-label="Sí">Sí</button>
<button id="no" class="choice" aria-label="No">No</button>
</div>
</div>

<div id="final" class="screen">
<img src="img/final.png" alt="Mensaje final para Meibellyn">
</div>

<div id="hearts" aria-hidden="true"></div>

<audio id="music" src="audio/ya_borracho.mp3" preload="auto"></audio>

<script>
(function(){
const slides=[
'slide_01.jpg',
'slide_02.jpg',
'slide_03.jpg',
'slide_04.jpg',
'slide_05.jpg',
'slide_06.jpg'
];

const intro=document.getElementById('intro');
const sequence=document.getElementById('sequence');
const proposal=document.getElementById('proposal');
const finalScreen=document.getElementById('final');
const slide=document.getElementById('slide');
const music=document.getElementById('music');
const start=document.getElementById('start');
const yes=document.getElementById('yes');
const no=document.getElementById('no');
const hearts=document.getElementById('hearts');

let index=0;
let timer=null;
let started=false;

function show(el){
document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
}

function playMusic(){
music.currentTime=0;
const p=music.play();
if(p&&p.catch)p.catch(()=>{});
}

function showSlide(i){
index=i;
slide.src='img/'+slides[i];
show(sequence);
}

function startSequence(){
if(started)return;
started=true;
playMusic();
showSlide(0);

timer=setInterval(function(){
if(index<slides.length-1){
showSlide(index+1);
}else{
clearInterval(timer);
timer=null;
show(proposal);
}
},14000);
}

start.addEventListener('click',startSequence);
start.addEventListener('touchend',function(e){
e.preventDefault();
startSequence();
},{passive:false});

function heartRain(){
hearts.innerHTML='';
for(let i=0;i<70;i++){
const h=document.createElement('div');
h.className='heart';
h.textContent=Math.random()<0.5?'❤️':'💛';
h.style.left=(Math.random()*100)+'%';
h.style.animationDelay=(Math.random()*1.5)+'s';
h.style.fontSize=(20+Math.random()*25)+'px';
hearts.appendChild(h);
}
}

yes.addEventListener('click',function(e){
e.preventDefault();
if(timer){clearInterval(timer);timer=null;}
show(proposal);
heartRain();
setTimeout(function(){
show(finalScreen);
finalScreen.classList.add('final-fade');
},3600);
});

no.addEventListener('click',function(e){
e.preventDefault();
});
})();
</script>

</body>
</html>
