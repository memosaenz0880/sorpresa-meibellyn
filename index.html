<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para Meibellyn ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#000}
.introCard{position:relative;width:min(100vw,61vh);aspect-ratio:2/3;display:flex;align-items:center;justify-content:center}
.introCard img{width:100%;height:100%;object-fit:contain;display:block}
#startBtn{position:absolute;left:10%;width:80%;bottom:11%;height:24%;border:0;background:transparent;border-radius:28px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .7s;pointer-events:none;background:#000}
.slide.active{opacity:1}
.slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
#audio{display:none}
#proposal{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;background:#000;}
.proposalCard{position:relative;width:min(100vw,66.67vh);aspect-ratio:2/3;display:flex;align-items:center;justify-content:center}
.proposalCard>img{width:100%;height:100%;object-fit:contain;display:block}
#proposalButtons{position:absolute;inset:0;pointer-events:none}
#proposalButtons button{position:absolute;border:0;cursor:pointer;pointer-events:auto;font-weight:800;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:#fff;text-shadow:0 2px 3px #0008;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
/* Botones reales colocados sobre los corazones de la imagen */
#yes{left:17.5%;top:59.5%;width:31%;height:15%;background:linear-gradient(145deg,#ff4f66,#d71935);border-radius:45% 45% 48% 48%;font-size:clamp(18px,5.5vw,34px);box-shadow:inset 0 4px 8px #fff7,0 6px 16px #0008;clip-path:polygon(50% 100%,7% 58%,2% 40%,5% 20%,18% 5%,34% 4%,50% 18%,66% 4%,82% 5%,95% 20%,98% 40%,93% 58%)}
#no{left:56.5%;top:60.5%;width:27%;height:13%;background:linear-gradient(145deg,#fff7ef,#e8d5c8);color:#3a2018;text-shadow:none;border-radius:45% 45% 48% 48%;font-size:clamp(17px,5vw,30px);box-shadow:inset 0 3px 8px #fff,0 5px 15px #0007;clip-path:polygon(50% 100%,7% 58%,2% 40%,5% 20%,18% 5%,34% 4%,50% 18%,66% 4%,82% 5%,95% 20%,98% 40%,93% 58%);transition:left .35s ease,top .35s ease}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.heart{position:absolute;top:-8vh;animation:fall 4s linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(360deg);opacity:0}}
#final{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:#000}
#final img{width:100%;height:100%;object-fit:contain;display:block}
</style>
</head>
<body>
<div id="intro"><div class="introCard"><img src="img/intro_girasol_corazon.png" alt="Toca el girasol para comenzar"><button id="startBtn" aria-label="Toca el girasol para comenzar"></button></div></div>
<div id="stage"></div>
<audio id="audio" preload="auto" playsinline src="audio/ya_borracho.mp3"></audio>
<div id="proposal">
  <div class="proposalCard">
    <img src="img/propuesta.png" alt="¿Quieres ser mi novia?">
    <div id="proposalButtons">
      <button id="yes" type="button" aria-label="Sí">Sí ❤️</button>
      <button id="no" type="button" aria-label="No">No 🥺</button>
    </div>
  </div>
</div>
<div id="hearts"></div>
<div id="final"><img src="img/final.png" alt="¡Sabía que dirías que sí!"></div>
<script>
const files=["slide_01.jpg","slide_02.jpg","slide_03.jpg","slide_04.jpg","slide_05.jpg","slide_06.jpg"];
const stage=document.getElementById("stage");
files.forEach((f,i)=>{const d=document.createElement("div");d.className="slide"+(i===0?" active":"");d.innerHTML='<img src="img/'+f+'" alt="Sorpresa para Meibellyn">';stage.appendChild(d)});
const slides=[...document.querySelectorAll(".slide")];
const intro=document.getElementById("intro");
const startBtn=document.getElementById("startBtn");
const proposal=document.getElementById("proposal");
const audio=document.getElementById("audio");
const hearts=document.getElementById("hearts");
const final=document.getElementById("final");
const no=document.getElementById("no");
let started=false,timer,noTimer;
function show(i){slides.forEach((s,j)=>s.classList.toggle("active",j===i));}
function moveNo(){
  const spots=[
    {left:"56.5%",top:"60.5%"},
    {left:"13%",top:"72%"},
    {left:"55%",top:"76%"},
    {left:"8%",top:"61%"},
    {left:"63%",top:"70%"}
  ];
  const current=no.dataset.spot||"-1";
  let n=Math.floor(Math.random()*spots.length);
  while(String(n)===current)n=Math.floor(Math.random()*spots.length);
  no.dataset.spot=n;
  no.style.left=spots[n].left;
  no.style.top=spots[n].top;
}
startBtn.addEventListener("click",async()=>{
  if(started)return;
  started=true;
  intro.style.display="none";
  audio.currentTime=0;
  try{await audio.play();}catch(e){
    const retry=()=>{audio.play().catch(()=>{});document.removeEventListener("click",retry);document.removeEventListener("touchstart",retry);};
    document.addEventListener("click",retry,{once:true});
    document.addEventListener("touchstart",retry,{once:true});
  }
  let i=0;
  show(0);
  timer=setInterval(()=>{
    i++;
    if(i<slides.length){show(i);}
    else{
      clearInterval(timer);
      proposal.style.display="flex";
      moveNo();
      noTimer=setInterval(moveNo,2800);
    }
  },14000);
});
document.getElementById("yes").addEventListener("click",()=>{
  proposal.style.display="none";
  clearInterval(noTimer);
  for(let i=0;i<100;i++){
    const h=document.createElement("span");
    h.className="heart";
    h.textContent="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(16+Math.random()*24)+"px";
    h.style.animationDelay=Math.random()*1.7+"s";
    hearts.appendChild(h);
  }
  setTimeout(()=>{hearts.innerHTML="";final.style.display="flex";},4200);
});
no.addEventListener("mouseenter",moveNo);
no.addEventListener("touchstart",e=>{e.preventDefault();moveNo();},{passive:false});
</script>
</body>
</html>
