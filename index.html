<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para Meibellyn ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111e}
.stage,.slide{position:fixed;inset:0}.slide{opacity:0;transition:opacity .7s}.slide.active{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8vh;background:#0002}
button{border:0;border-radius:999px;padding:15px 27px;font-size:18px;font-weight:700}
#start button,#yes{background:#ff4f88;color:white;box-shadow:0 8px 30px #0006}
#proposal{display:none;position:fixed;inset:0;z-index:25;align-items:flex-end;justify-content:center;padding-bottom:11vh;gap:14px}
#no{background:#222;color:white;position:relative}
#audio{position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;opacity:0}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.heart{position:absolute;top:-8vh;animation:fall 4s linear forwards}@keyframes fall{to{transform:translateY(120vh) rotate(360deg);opacity:0}}
</style></head><body>
<div class="stage" id="stage"></div><iframe id="audio" allow="autoplay; encrypted-media" title="audio"></iframe>
<div id="start"><button>Comenzar mi sorpresa ❤️</button></div>
<div id="proposal"><button id="yes">Sí ❤️</button><button id="no">No 🥺</button></div><div id="hearts"></div>
<script>
const files=["slide_1.jpg","slide_2.jpg","slide_3.jpg","slide_4.jpg","slide_5.jpg","slide_6.jpg","slide_7.jpg","slide_8.jpg","slide_9.jpg","slide_10.jpg"];
const stage=document.getElementById("stage");
files.forEach((f,i)=>{let d=document.createElement("div");d.className="slide"+(i===0?" active":"");d.innerHTML='<img src="img/'+f+'" alt="Sorpresa para Meibellyn">';stage.appendChild(d)});
const slides=[...document.querySelectorAll(".slide")],start=document.getElementById("start"),proposal=document.getElementById("proposal"),audio=document.getElementById("audio");let started=false,timer;
function show(i){slides.forEach((s,j)=>s.classList.toggle("active",j===i))}
start.onclick=()=>{if(started)return;started=true;start.style.display="none";audio.src="https://www.youtube.com/embed/7SsmyjVF1Oo?autoplay=1&playsinline=1&controls=0&rel=0&loop=1&playlist=7SsmyjVF1Oo";let i=0;timer=setInterval(()=>{i++;if(i<9)show(i);else{clearInterval(timer);show(8);proposal.style.display="flex"}},5200)};
document.getElementById("yes").onclick=()=>{proposal.style.display="none";for(let i=0;i<75;i++){let h=document.createElement("span");h.className="heart";h.textContent="❤️";h.style.left=Math.random()*100+"vw";h.style.fontSize=(16+Math.random()*24)+"px";h.style.animationDelay=Math.random()*1.7+"s";document.getElementById("hearts").appendChild(h)}};
const no=document.getElementById("no");function escapeNo(){no.style.position="fixed";no.style.left=(8+Math.random()*72)+"vw";no.style.top=(25+Math.random()*58)+"vh"}no.addEventListener("mouseenter",escapeNo);no.addEventListener("touchstart",e=>{e.preventDefault();escapeNo()});
</script></body></html>
